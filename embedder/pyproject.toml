[project]
name = "homemusic-embedder"
version = "0.1.0"
description = "HomeMusic embedder: audio/text vectors (MuQ-MuLan) on the GPU for mixes and the wave"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.145.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "numpy>=2.0",
]

[project.optional-dependencies]
# The real model. Tests run without it (a fake model); the image installs it.
gpu = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    # pulled in by x-clip; must be the build paired with torch (the PyPI one fails with "torchvision::nms does not exist")
    "torchvision==0.26.0",
    "muq==0.1.0",
    "transformers>=4.46,<5",
]
cpu = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "muq==0.1.0",
    "transformers>=4.46,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-xdist>=3.8",
    "respx>=0.22",
    "ruff>=0.13",
]

[tool.uv]
# the image is Linux; no need to resolve Windows/macOS wheels of torch
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{extra = "cpu"}, {extra = "gpu"}]]

# PyTorch with CUDA 12.8: the first build with Blackwell (sm_120, RTX 50xx) kernels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "gpu" }, { index = "pytorch-cpu", extra = "cpu" }]
torchaudio = [{ index = "pytorch-cu128", extra = "gpu" }, { index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cu128", extra = "gpu" }, { index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["gpu: loads the real model (set EMBEDDER_REAL_MODEL_TESTS=1; needs the image with the gpu extra)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "RUF", "I", "ASYNC"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF012"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
