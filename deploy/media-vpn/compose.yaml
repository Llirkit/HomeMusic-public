# Use instead of the youtube-zapret overlay. Private VPN files live outside the checkout.
services:
  media-vpn:
    image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    entrypoint: [/usr/local/bin/xray, run, -config, /run/media-vpn/config.json]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - /etc/homemusic-vpn/xray:/usr/local/bin/xray:ro
      - /etc/homemusic-vpn/config.json:/run/media-vpn/config.json:ro
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',19810),timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options: {max-size: "2m", max-file: "2"}
  hub:
    depends_on:
      media-vpn: {condition: service_healthy}
    environment:
      OUTBOUND_PROXY: http://media-vpn:19810
      OUTBOUND_PROXY_HOSTS: youtube.com,youtu.be,googlevideo.com,youtube-nocookie.com,ytimg.com,ggpht.com,soundcloud.com,sndcdn.com,soundcloud.cloud
  youtube-pot:
    depends_on:
      media-vpn: {condition: service_healthy}
    environment:
      HTTP_PROXY: http://media-vpn:19810
      HTTPS_PROXY: http://media-vpn:19810
      NO_PROXY: localhost,127.0.0.1,::1,youtube-pot,hub,navidrome,media-vpn
